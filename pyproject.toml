[project]
name = "modulebanktest"
version = "0.1.0"
description = "Payment processing service with provider integration"
authors = [
    {name = "Marina Andreeva"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.139.2,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "prometheus-client (>=0.26.0,<0.27.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.0,<0.17.0)"
]

[tool.ruff]
exclude = [
    "alembic",
    ".venv",
    "__pycache__",
]